<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CreditCardPromos.ph Logo Concepts</title>
    <style>
      :root {
        color: #1d2a43;
        background: #f6f8fb;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        padding: 34px;
      }

      main {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 26px;
        color: #65748d;
        font-size: 16px;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      figure {
        margin: 0;
        padding: 18px;
        border: 1px solid #dbe3ef;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 5px 15px rgb(35 57 89 / 6%);
      }

      img {
        width: 100%;
        height: auto;
        display: block;
      }

      figcaption {
        margin-top: 12px;
        color: #40506a;
        font-size: 15px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CreditCardPromos.ph Logo Concepts</h1>
      <p>Five vector directions based on the recommended logo routes.</p>
      <div class="grid">
        <figure>
          <img src="./01-card-tag.svg" alt="Card and tag logo concept">
          <figcaption>1. Card + Tag</figcaption>
        </figure>
        <figure>
          <img src="./02-stacked-cards-spark.svg" alt="Stacked cards and spark logo concept">
          <figcaption>2. Stacked Cards + Spark</figcaption>
        </figure>
        <figure>
          <img src="./03-search-card.svg" alt="Search card logo concept">
          <figcaption>3. Magnifying Glass + Card</figcaption>
        </figure>
        <figure>
          <img src="./04-ccp-monogram.svg" alt="CCP monogram logo concept">
          <figcaption>4. CCP Monogram</figcaption>
        </figure>
        <figure>
          <img src="./05-card-ph-badge.svg" alt="Card with PH badge logo concept">
          <figcaption>5. Card + PH Badge</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
